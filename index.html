<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Hub</title>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <div vw class="enabled">
      <div vw-access-button></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script>
      window.addEventListener("load", () => {
        const initVL = () => {
          if (window.VLibras && window.VLibras.Widget) {
            // Inicializa o widget
            new window.VLibras.Widget("https://vlibras.gov.br/app");
            
            // Tenta forçar a visibilidade do wrapper principal assim que inicializa
            const vwContainer = document.querySelector('[vw]');
            if (vwContainer) {
              vwContainer.style.visibility = 'visible';
              vwContainer.style.opacity = '1';
              vwContainer.style.display = 'block';
            }
            
            return true;
          }
          return false;
        };

        // Tenta inicializar. Se falhar, tenta a cada 500ms.
        if (!initVL()) {
          const interval = setInterval(() => {
            if (initVL()) clearInterval(interval);
          }, 500);
        }
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
