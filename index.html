<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Hub</title>

    <!-- SEO e redes sociais -->
    <meta property="og:title" content="Connect Hub" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ✅ VLibras Widget Script -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <!-- ✅ VLibras Container (deve vir antes da inicialização) -->
    <div vw class="enabled">
      <div vw-access-button class="active" style="display: none;"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <!-- ✅ Inicialização do VLibras (após o container e script) -->
    <script>
      window.addEventListener("load", function () {
        if (window.VLibras?.Widget) {
          new window.VLibras.Widget("https://vlibras.gov.br/app");
        } else {
          console.warn("VLibras não disponível.");
        }
      });
    </script>

    <!-- ✅ App principal -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
